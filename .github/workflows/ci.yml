name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # stage : install
  dependances:
    runs-on: ubuntu-latest
    container: composer:2                       # image: composer:2
    steps:
      - uses: actions/checkout@v4

      # variables: COMPOSER_CACHE_DIR dans le projet (comme $CI_PROJECT_DIR)
      - run: echo "COMPOSER_CACHE_DIR=$GITHUB_WORKSPACE/.composer-cache" >> "$GITHUB_ENV"

      # cache: clé = composer.lock, chemin = .composer-cache/
      - uses: actions/cache@v4
        with:
          path: .composer-cache/
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress

      # artifacts: paths [vendor/], expire_in (1 jour = minimum sur GitHub)
      - uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor/
          retention-days: 1

  # stage : qualite
  lint-phpcs:
    runs-on: ubuntu-latest
    container: php:8.3-cli                      # image: php:8.3-cli
    needs: [dependances]                        # needs: [dependances]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/
      # un artifact perd les droits d'exécution : on lance via php
      - run: php vendor/squizlabs/php_codesniffer/bin/phpcs

  analyse-phpstan:
    runs-on: ubuntu-latest
    container: php:8.3-cli
    needs: [dependances]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/
      - run: php vendor/phpstan/phpstan/phpstan analyse --no-progress

  # stage : test
  test-unitaires:
    runs-on: ubuntu-latest
    container: php:8.3-cli
    needs: [dependances]
    permissions:
      contents: read
      checks: write                             # pour publier le rapport JUnit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/
      - run: php vendor/phpunit/phpunit/phpunit --testsuite Unit --log-junit rapport-unit.xml

      # reports: junit  (if: always() = artifacts: when: always)
      - uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5.6.2
        if: always()
        with:
          report_paths: rapport-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-unit
          path: rapport-unit.xml
          retention-days: 1

  test-integration:
    runs-on: ubuntu-latest
    container: php:8.3-cli
    needs: [dependances]
    permissions:
      contents: read
      checks: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: taches
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uapp -papp"
          --health-interval=5s --health-retries=20
    env:
      DB_HOST: mysql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/
      - run: docker-php-ext-install pdo_mysql > /dev/null  # <- Il ny a pas de before_script dans un workflow GitHub Actions.
      - run: php vendor/phpunit/phpunit/phpunit --testsuite Integration --log-junit rapport-integration.xml
      - uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5.6.2
        if: always()
        with:
          report_paths: rapport-integration.xml
          check_name: Tests intégration

  build-image:
    runs-on: ubuntu-latest
    needs: [lint-phpcs, test-unitaires, test-integration, analyse-phpstan]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Connexion au registre
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build et push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA="${GITHUB_SHA::7}"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE:$SHA" .
          docker push "$IMAGE:$SHA"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "$IMAGE:$SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            docker tag "$IMAGE:$SHA" "$IMAGE:$GITHUB_REF_NAME"
            docker push "$IMAGE:$GITHUB_REF_NAME"
          fi
